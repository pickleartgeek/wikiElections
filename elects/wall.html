<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Wall — TSR Elects</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  :root, [data-wt="slate"] { --w-bg: #12151b; --w-empty: #272c36; --w-grad: radial-gradient(120% 90% at 80% -10%, #343b49 0%, #1d222b 48%, #12151b 100%); --w-card: rgba(255,255,255,.06); }
  [data-wt="graphite"] { --w-bg: #0d0d0e; --w-empty: #262628; --w-grad: radial-gradient(120% 90% at 80% -10%, #35353a 0%, #1a1a1c 48%, #0d0d0e 100%); }
  [data-wt="purple"] { --w-bg: #120626; --w-empty: #2a2147; --w-grad: radial-gradient(120% 90% at 80% -10%, #3a1473 0%, #14171d 45%, #120626 100%); }
  :root { --w-card: rgba(255,255,255,.06); --w-line: rgba(255,255,255,.14); --w-dim: rgba(255,255,255,.58); --w-gold: #ffd84d; }
  html { background: var(--w-bg); } html, body { margin: 0; min-height: 100%; }
  body.wall { background: var(--w-grad); color: #fff; font-family: var(--font-elects-body, system-ui, sans-serif); overflow-x: hidden; }
  .wall a { color: inherit; }
  .w-app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

  /* header */
  .w-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 22px; border-bottom: 1px solid var(--w-line); }
  .w-exit { text-decoration: none; font-weight: 700; font-size: 13px; padding: 7px 14px; border: 1px solid var(--w-line); border-radius: 999px; color: var(--w-dim); }
  .w-exit:hover { color: #fff; border-color: #fff; }
  .w-brand { display: flex; flex-direction: column; margin-right: auto; }
  .w-brand small { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--w-gold); }
  .w-brand h1 { margin: 0; font-family: var(--font-elects-display, inherit); font-size: clamp(22px, 3.2vw, 38px); line-height: 1.05; }
  .w-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .w-ctl select, .w-seg button, .w-btn { font: inherit; font-size: 13px; font-weight: 700; color: #fff; background: var(--w-card); border: 1px solid var(--w-line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .w-ctl select { appearance: none; padding-right: 14px; max-width: 210px; text-overflow: ellipsis; }
  .w-ctl select option { color: #111; }
  .w-seg { display: inline-flex; border: 1px solid var(--w-line); border-radius: 999px; overflow: hidden; }
  .w-seg button { border: 0; border-radius: 0; background: transparent; }
  .w-seg button.on { background: #fff; color: #14171d; }
  .w-btn:hover, .w-ctl select:hover { border-color: #fff; }
  .w-btn.gold { background: var(--w-gold); color: #14171d; border-color: var(--w-gold); }

  /* stage */
  .w-main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; gap: 18px; padding: 18px 22px 8px; min-height: 0; }
  .w-rail, .w-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .w-h { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--w-dim); margin: 2px 2px 2px; display: flex; justify-content: space-between; align-items: center; }
  .w-cand { --c: #888; position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--w-line); border-left: 5px solid var(--c); border-radius: 14px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 18%, transparent), var(--w-card) 70%); cursor: pointer; text-align: left; color: #fff; font: inherit; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .w-cand:hover { transform: translateX(3px); }
  .w-cand.on { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 10px 30px color-mix(in srgb, var(--c) 40%, transparent); }
  .w-cand.dim { opacity: .5; }
  .w-face { width: 54px; height: 54px; border-radius: 50%; background: var(--c); border: 3px solid var(--c); grid-row: span 2; object-fit: cover; box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
  .w-cname { font-weight: 800; font-size: 15px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w-cpct { font-family: var(--font-elects-display, inherit); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .w-cpct small { font-size: 20px; }
  .w-cvotes { font-size: 12px; color: var(--w-dim); font-variant-numeric: tabular-nums; }
  .w-tag { position: absolute; right: 14px; bottom: 24px; font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 3px 8px; border-radius: 99px; background: var(--w-gold); color: #14171d; }
  .w-bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; }
  .w-bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .w-whatif { padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--w-gold); background: rgba(255,216,77,.08); font-size: 14px; line-height: 1.35; }
  .w-whatif b { color: var(--w-gold); }

  .w-mapwrap { position: relative; border: 1px solid var(--w-line); border-radius: 18px; background: rgba(0,0,0,.18); overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 420px; }
  .w-map { width: 100%; height: 100%; max-height: 72vh; display: block; }
  .w-grp path { stroke: rgba(255,255,255,.55); stroke-width: 1.4; stroke-linejoin: round; cursor: pointer; transition: fill .5s, fill-opacity .5s, stroke-width .15s; vector-effect: non-scaling-stroke; }
  .w-grp:hover path { stroke: #fff; stroke-width: 3; }
  .w-grp.sel path { stroke: var(--w-gold); stroke-width: 4; }
  .w-grp.flip path { stroke-dasharray: 6 5; stroke: var(--w-gold); stroke-width: 3; }
  .w-grp.empty path { fill: var(--w-empty); fill-opacity: .85; stroke-dasharray: 3 4; }
  .w-glab { pointer-events: none; font-family: var(--font-elects-display, inherit); text-anchor: middle; fill: #fff; paint-order: stroke; stroke: rgba(10,4,24,.75); stroke-width: 4px; stroke-linejoin: round; }
  .w-glab .n { font-size: 24px; } .w-glab .m { font-size: 17px; font-family: var(--font-elects-body, inherit); font-weight: 800; }
  .w-legend { position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: var(--w-dim); max-width: 60%; }
  .w-callout { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 7px 18px; border-radius: 99px; background: var(--w-gold); color: #14171d; font-family: var(--font-elects-display, inherit); font-size: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.4); white-space: nowrap; }
  .w-callout[hidden] { display: none; }

  .w-panel { border: 1px solid var(--w-line); border-radius: 16px; background: var(--w-card); padding: 16px; }
  .w-panel h3 { margin: 0 0 2px; font-family: var(--font-elects-display, inherit); font-size: 30px; line-height: 1; }
  .w-sub { font-size: 12px; color: var(--w-dim); margin-bottom: 10px; }
  .w-row { --c: #888; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; margin: 9px 0; }
  .w-row img { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 2px solid var(--c); object-fit: cover; grid-row: span 2; }
  .w-row .nm { font-weight: 700; font-size: 13px; } .w-row .pc { font-family: var(--font-elects-display, inherit); font-size: 22px; font-variant-numeric: tabular-nums; }
  .w-row .bar { grid-column: 2 / 4; height: 5px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; } .w-row .bar i { display: block; height: 100%; background: var(--c); transition: width .5s; }
  .w-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .w-stat { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); }
  .w-stat b { display: block; font-family: var(--font-elects-display, inherit); font-size: 26px; line-height: 1.05; } .w-stat span { font-size: 11px; color: var(--w-dim); }
  .w-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .w-chip { --c: #888; font: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 99px; border: 1.5px solid var(--c); background: transparent; color: #fff; cursor: pointer; }
  .w-chip:hover, .w-chip.on { background: var(--c); color: #111; }
  .w-hint { font-size: 12px; color: var(--w-dim); line-height: 1.45; }

  /* scrubber */
  .w-foot { padding: 8px 22px 18px; }
  .w-scrub { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; border: 1px solid var(--w-line); border-radius: 16px; background: var(--w-card); padding: 12px 18px; }
  .w-play { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--w-gold); color: #14171d; font-size: 18px; cursor: pointer; }
  .w-track { position: relative; }
  .w-ticks { display: flex; gap: 2px; height: 14px; align-items: flex-end; margin-bottom: 4px; }
  .w-ticks i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--c, #888); opacity: .35; height: 55%; transition: opacity .2s, height .2s; }
  .w-ticks i.in { opacity: 1; height: 100%; }
  .w-track input { width: 100%; accent-color: var(--w-gold); margin: 0; }
  .w-time { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 200px; } .w-time b { display: block; font-family: var(--font-elects-display, inherit); font-size: 22px; }
  .w-scrub.static { opacity: .55; pointer-events: none; }

  #wSide { display: flex; flex-direction: column; gap: 10px; }
  .w-live { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 99px; background: #e0242f; color: #fff; letter-spacing: .1em; animation: wBlink 1.6s ease-in-out infinite; }
  @keyframes wBlink { 50% { opacity: .55; } }
  .w-livechips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .w-livechips:empty { display: none; }
  .w-livechips button { font: inherit; font-size: 12px; font-weight: 800; color: #fff; background: rgba(224,36,47,.18); border: 1px solid rgba(224,36,47,.7); border-radius: 99px; padding: 4px 11px; cursor: pointer; } .w-livechips button.on { background: #e0242f; }
  .w-livebar { grid-column: 1 / -1; display: none; align-items: center; gap: 14px; font-size: 14px; } .w-scrub.live .w-livebar { display: flex; }
  .w-scrub.live > :not(.w-livebar) { display: none; }
  .w-scrub.live { grid-template-columns: 1fr; }
  .w-livebar .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0242f; animation: wBlink 1.2s infinite; } .w-livebar b { font-family: var(--font-elects-display, inherit); font-size: 22px; } .w-livebar span { color: var(--w-dim); } .w-livebar .sp { flex: 1; }
  .w-grp.fresh path { animation: wFlash 1.8s ease-out; } @keyframes wFlash { 0% { filter: brightness(2.4) saturate(1.4); } 100% { filter: none; } }
  .w-callout.called { background: #fff; color: #14171d; } .w-callout.open { background: rgba(255,255,255,.14); color: #fff; font-size: 16px; backdrop-filter: blur(6px); }
  .w-odds .w-orow { --c: #888; display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center; margin: 9px 0; }
  .w-odds .w-orow img { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 2px solid var(--c); grid-row: span 2; object-fit: cover; }
  .w-odds .w-orow .nm { font-weight: 700; font-size: 13px; } .w-odds .w-orow .pc { font-family: var(--font-elects-display, inherit); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1; }
  .w-odds .w-orow .bar { grid-column: 2 / 4; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; } .w-odds .w-orow .bar i { display: block; height: 100%; background: var(--c); transition: width .6s; }
  .w-odds button.tip { font: inherit; font-size: 12px; font-weight: 800; color: var(--w-gold); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .w-callbanner { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -30px); opacity: 0; z-index: 70; width: min(760px, calc(100vw - 28px)); display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; padding: 26px 32px; border-radius: 24px; color: #fff; background: linear-gradient(120deg, color-mix(in srgb, var(--c, #36a) 60%, #0a1a30), #0a1a30); border: 2px solid var(--c, #fff); box-shadow: 0 30px 90px rgba(0,0,0,.65); cursor: pointer; transition: opacity .5s, transform .5s cubic-bezier(.2,1.2,.3,1); }
  .w-callbanner.show { opacity: 1; transform: translate(-50%, 0); } .w-callbanner[hidden] { display: none; }
  .w-callbanner img { width: 150px; height: 150px; border-radius: 50%; border: 6px solid #fff; background: var(--c); object-fit: cover; }
  .w-callbanner small { display: block; font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--w-gold); } html[data-live="1"] #wSide > .w-panel.w-hint { display: none; }
  .w-callbanner h2 { overflow-wrap: normal; word-break: keep-all; text-wrap: balance; margin: 4px 0 6px; font-family: var(--font-elects-display, inherit); font-size: clamp(30px, 5vw, 52px); line-height: 1; } .w-callbanner p { margin: 0; font-size: 16px; opacity: .85; }
  @media (max-width: 560px) { .w-callbanner { grid-template-columns: 1fr; text-align: center; justify-items: center; } .w-callbanner img { width: 96px; height: 96px; } }
  #wInk { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; touch-action: none; }
  #wInk.on { pointer-events: auto; cursor: crosshair; }
  .w-pen { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: rgba(12,14,18,.92); border: 1px solid var(--w-line); box-shadow: 0 12px 40px rgba(0,0,0,.55); backdrop-filter: blur(8px); max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; }
  .w-pen[hidden] { display: none; }
  .w-pen button { font: inherit; font-size: 12px; font-weight: 800; color: #fff; background: rgba(255,255,255,.08); border: 1px solid var(--w-line); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
  .w-pen button.on { background: #fff; color: #14171d; } .w-pen button.gold { background: var(--w-gold); color: #14171d; border-color: var(--w-gold); }
  .w-pc { width: 24px; height: 24px; border-radius: 50%; background: var(--c); border: 3px solid rgba(255,255,255,.25); cursor: pointer; } .w-pc.on { border-color: #fff; box-shadow: 0 0 0 2px var(--c); }
  .w-sep { width: 1px; height: 22px; background: var(--w-line); }
  @media (max-width: 1100px) { .w-main { grid-template-columns: 1fr; } .w-rail { flex-direction: row; overflow-x: auto; padding-bottom: 6px; } .w-rail .w-cand { min-width: 250px; } .w-rail .w-h { display: none; } .w-map { max-height: 60vh; } }
  @media (max-width: 640px) { .w-scrub { grid-template-columns: auto 1fr; } .w-time { grid-column: 1 / -1; text-align: left; min-width: 0; display: flex; gap: 10px; align-items: baseline; } .w-top { padding: 12px 14px; } .w-main { padding: 14px; } .w-foot { padding: 8px 14px 16px; } }
  /* phones: a tapped group opens as a bottom sheet over the map instead of a panel far below it */
  @media (max-width: 1100px) {
    #wSide.w-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-height: 42vh; overflow: auto; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); background: var(--w-bg); border-top: 1px solid var(--w-line); border-radius: 20px 20px 0 0; box-shadow: 0 -18px 50px rgba(0,0,0,.5); animation: wSheet .25s ease-out; overscroll-behavior: contain; }
    html.sheet-open body { padding-bottom: 42vh; } html.sheet-open .w-map { max-height: 54vh; }
    #wSide.w-sheet .w-stats { grid-template-columns: 1fr 1fr; } #wSide.w-sheet .w-stat b { font-size: 20px; } #wSide.w-sheet h3 { font-size: 22px; margin: 0 0 2px; }
    .w-btn#wClose { min-width: 44px; min-height: 36px; }
    .w-chip { min-height: 40px; }
  }
  @keyframes wSheet { from { transform: translateY(40px); opacity: 0; } }
  @media (max-width: 640px) {
    .w-callout { max-width: calc(100% - 24px); width: max-content; white-space: normal; text-align: center; font-size: 14px; line-height: 1.2; padding: 7px 14px; border-radius: 16px; }
    .w-scrub.live { padding: 10px 14px; } .w-livebar { flex-wrap: wrap; gap: 6px 10px; font-size: 12px; } .w-livebar b { font-size: 18px; } .w-livebar .sp { display: none; } .w-livebar #wLiveAt { flex: 1 1 100%; order: 5; } .w-livebar #wLiveIn { order: 6; flex: 1; } .w-livebar .w-btn { order: 7; white-space: nowrap; }
    .w-brand h1 { font-size: 26px; } .w-pen { bottom: 14px; width: calc(100vw - 20px); max-width: none; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: 6px; padding: 8px 12px; border-radius: 999px; scrollbar-width: none; } .w-pen > * { flex: none; } .w-pen #wDone { position: sticky; right: 0; } html.pen-on #wSide.w-sheet { display: none; } html.pen-on body { padding-bottom: 0; }
    .w-pc { width: 30px; height: 30px; }
  }

  /* ---- six additions: rehearsal pill, tipping point, rounds, stream ---- */
  .w-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .w-stat { min-width: 0; } .w-stat b { overflow-wrap: anywhere; }
  .w-live.reh { background: #d99a1e; color: #14171d; }
  .w-tag.out { background: rgba(255,255,255,.2); color: #fff; }
  .w-tipring { fill: none; stroke: var(--w-gold); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: wPing 2.2s ease-out infinite; } .w-tipring.r2 { animation-delay: 1.1s; }
  @keyframes wPing { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .w-rounds { display: grid; gap: 10px; } .w-rd .w-rdh { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; } .w-rd .w-rdh span { color: var(--w-dim); }
  .w-rdbar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,.08); } .w-rdbar i { display: block; height: 100%; position: relative; transition: width .4s; } .w-rdbar em { font-style: normal; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #0c1018; }
  .w-rounds .w-seg { justify-self: start; margin-top: 4px; } .w-rounds .w-seg button { padding: 6px 12px; font-size: 12px; }
  html[data-stream] .w-ctl { position: fixed; top: 8px; right: 10px; z-index: 80; opacity: 0; transition: opacity .25s; } html[data-stream] .w-ctl:hover, html[data-stream] .w-ctl:focus-within { opacity: 1; }
  html[data-stream] .w-ctl > :not(#wStream) { display: none !important; }
  html[data-stream] .w-exit, html[data-stream] .w-foot, html[data-stream] .w-legend, html[data-stream] .w-livechips, html[data-stream] #wSide > .w-panel.w-hint { display: none !important; }
  html[data-stream] .w-brand h1 { font-size: clamp(34px, 3.4vw, 56px); }
  html[data-stream] .w-live { font-size: 15px; }
  @media (min-width: 1500px) { html[data-stream] .w-main { zoom: 1.12; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="wall">
<div class="w-app">
  <header class="w-top">
    <a class="w-exit" id="wClassic" href="./?classic=1" title="The standard TSR Elects page">Classic view</a>
    <div class="w-brand"><small>TSR Elects · Magic Wall <span class="w-live" id="wLivePill" hidden>● LIVE</span></small><h1 id="wTitle">Loading…</h1><div class="w-livechips" id="wLiveChips"></div></div>
    <div class="w-ctl">
      <select id="wElection" aria-label="Election"></select>
      <select id="wRound" aria-label="Round"></select>
      <select id="wRace" aria-label="Race" hidden></select>
      <span class="w-seg" role="group" aria-label="Map colouring"><button id="mLead" class="on">Leader</button><button id="mCand">Candidate</button></span>
      <button class="w-btn" id="wReset" hidden>Reset what-ifs</button>
      <button class="w-btn" id="wPenBtn" title="Draw on the screen (P)">✎ Pen</button>
      <button class="w-btn" id="wSave" title="Save a picture of this screen">⤓ Save</button>
      <button class="w-btn" id="wStream" title="Hide the controls for streaming (S)">Stream</button>
      <button class="w-btn" id="wTheme" title="Change the wall colours">Theme</button>
    </div>
  </header>

  <div class="w-main">
    <aside class="w-rail" id="wRail" aria-label="Candidates"></aside>
    <section class="w-mapwrap">
      <div class="w-callout" id="wCall" hidden></div>
      <svg id="wMap" class="w-map" role="img" aria-label="Map of voting groups"></svg>
      <div class="w-legend" id="wLegend"></div>
    </section>
    <aside class="w-side"><div id="wSide"></div><div id="wRounds"></div><div id="wOdds"></div></aside>
  </div>

  <footer class="w-foot">
    <div class="w-scrub" id="wScrub">
      <div class="w-livebar" id="wLiveBar"></div>
      <button class="w-play" id="wPlay" aria-label="Play the count">▶</button>
      <div class="w-track"><div class="w-ticks" id="wTicks"></div><input type="range" id="wRange" min="0" max="0" value="0" aria-label="Scrub through the ballots"></div>

  addEventListener('keydown', e => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey) return; if (e.key === 's' || e.key === 'S') setStream(!document.documentElement.dataset.stream); });

  // ---- save the screen as a picture: standings + map + whatever was drawn on it ----

    c.fillStyle = '#fff'; c.font = `800 40px ${fam}`; c.fillText(S.el.title || S.el.id, 40, 90, 880);
    c.fillStyle = 'rgba(255,255,255,.6)'; c.font = `600 17px ${body}`; c.fillText(S.race || '', 40, 116, 880);

    c.font = `800 14px ${body}`; const tw = c.measureText(tagTxt).width + 28; c.fillStyle = tagCol; c.beginPath(); c.roundRect(W - 40 - tw, 28, tw, 30, 15); c.fill(); c.fillStyle = '#fff'; c.fillText(tagTxt, W - 40 - tw + 14, 48);
    c.fillStyle = 'rgba(255,255,255,.6)'; c.font = `600 14px ${body}`; c.textAlign = 'right'; c.fillText(clockET(Date.now()) + ' · ' + new Date().toLocaleDateString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric' }), W - 40, 82); c.textAlign = 'left';
    // standings

    for (let i = 0; i < rows.length; i++) {
      const id = rows[i], y = y0 + i * rh, v = t[id] || 0, pc = tot ? v / tot * 100 : 0, col = bright(ncol(id)), won = ci.winners.includes(id);
      c.fillStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.roundRect(x0, y, 360, rh - 10, 16); c.fill(); c.fillStyle = col; c.fillRect(x0, y + 12, 5, rh - 34);
      const im = await load(photoOf(id)); const r = Math.min(30, (rh - 10) / 2 - 10);
      c.save(); c.beginPath(); c.arc(x0 + 28 + r, y + (rh - 10) / 2, r, 0, 7); c.fillStyle = col; c.fill(); c.clip(); if (im) c.drawImage(im, x0 + 28, y + (rh - 10) / 2 - r, r * 2, r * 2); c.restore();
      const tx = x0 + 28 + r * 2 + 14; c.fillStyle = '#fff'; c.font = `700 16px ${body}`; c.fillText(nname(id), tx, y + 28, won ? 120 : 200);
      c.font = `800 34px ${fam}`; c.fillText(pc.toFixed(1) + '%', tx, y + 64);
      c.fillStyle = 'rgba(255,255,255,.55)'; c.font = `600 13px ${body}`; c.fillText(fmt(v) + ' votes', tx + 118, y + 64);
      c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(tx, y + rh - 26, 300 - (tx - x0 - 40), 5); c.fillStyle = col; c.fillRect(tx, y + rh - 26, (300 - (tx - x0 - 40)) * pc / 100, 5);
      if (won) { c.fillStyle = '#ffd84d'; c.font = `800 11px ${body}`; const lab = ci.status === 'runoff' ? 'ADVANCES' : '✓ PROJECTED WINNER'; const lw = c.measureText(lab).width + 16; c.beginPath(); c.roundRect(x0 + 360 - lw - 12, y + 10, lw, 20, 10); c.fill(); c.fillStyle = '#14171d'; c.fillText(lab, x0 + 360 - lw - 4, y + 24); }
    }
    // map
    const vbW = S0 + 20, vbH = VH + 20, ax = 430, ay = 130, aw = 820, ah = 540, k = Math.min(aw / vbW, ah / vbH), mw = vbW * k, mh = vbH * k, mx = ax + (aw - mw) / 2, my = ay + (ah - mh) / 2;

      const lb = $('wMap').querySelector(`.w-glab[data-g="${pl.id}"]`), tt = lb ? [...lb.children].map(x => x.textContent) : []; labs += `<text x="${pl.c[0].toFixed(1)}" y="${pl.c[1].toFixed(1)}" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="27" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="3" paint-order="stroke">${esc(tt[0] || '')}</text><text x="${pl.c[0].toFixed(1)}" y="${(pl.c[1] + 28).toFixed(1)}" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="21" fill="#fff" stroke="rgba(0,0,0,.65)" stroke-width="3" paint-order="stroke">${esc(tt[1] || '')}</text>`; });
    let tip = ''; const tp = S.tip && polys.find(x => x.id === S.tip); if (tp) tip = `<circle cx="${tp.c[0].toFixed(1)}" cy="${tp.c[1].toFixed(1)}" r="34" fill="none" stroke="#ffd84d" stroke-width="3"/><circle cx="${tp.c[0].toFixed(1)}" cy="${tp.c[1].toFixed(1)}" r="5" fill="#ffd84d"/>`;
    const svgStr = `<svg xmlns="${svgns}" viewBox="-10 -10 ${vbW} ${vbH}" width="${Math.round(mw * 2)}" height="${Math.round(mh * 2)}">${paths}${labs}${tip}</svg>`;
    const mi = await load('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr)); if (mi) c.drawImage(mi, mx, my, mw, mh);

    const r = $('wMap').getBoundingClientRect(), sk = Math.min(r.width / vbW, r.height / vbH), iw = vbW * sk, ih = vbH * sk, ix = r.left + (r.width - iw) / 2, iy = r.top + (r.height - ih) / 2, f = mw / iw;
    pen.strokes.forEach(st => { if (!st.pts.length) return; c.strokeStyle = st.color; c.lineWidth = st.w * f; c.lineCap = c.lineJoin = 'round'; c.shadowColor = st.color; c.shadowBlur = st.w * f; c.beginPath(); st.pts.forEach((q, i) => { const X = mx + (q[0] - ix) * f, Y = my + (q[1] - iy) * f; if (!i) c.moveTo(X, Y); else c.lineTo(X, Y); }); if (st.pts.length === 1) c.lineTo(mx + (st.pts[0][0] - ix) * f + .1, my + (st.pts[0][1] - iy) * f); c.stroke(); }); c.shadowBlur = 0;

    c.fillText(`${fmt(tot)} votes counted${ci.winners.length ? ' · called by DDTSR' : ''}`, 40, H - 22);
    if (nf) { c.fillStyle = '#ffd84d'; c.font = `800 13px ${body}`; c.textAlign = 'right'; c.fillText(`WHAT-IF: ${nf} group${nf > 1 ? 's' : ''} flipped`, W - 40, H - 22); c.textAlign = 'left'; }
    const blob = await new Promise(res => cv2.toBlob(res, 'image/png')); if (!blob) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tsr-wall-${S.el.id}-${(S.race || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}.png`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    window.__lastImage = { w: cv2.width, h: cv2.height, bytes: blob.size, url: null };
    return blob;
  }
  $('wSave').onclick = () => { $('wSave').disabled = true; saveImage().catch(e => console.warn('save image', e)).finally(() => { $('wSave').disabled = false; }); };
  window.__save = saveImage;
  window.__wall = S; window.__pen = pen; window.__drawTip = drawTip;
})();
